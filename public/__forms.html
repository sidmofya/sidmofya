<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection (do not link)</title>
  </head>
  <body>
    <!--
      This file exists so Netlify's build-time form-detection bot sees the
      client-rendered forms, which would otherwise not be present in the
      static HTML it scans.

      Every field on the live form MUST also appear here, with the same
      `name` attribute, or Netlify will drop it from submissions.
    -->

    <!-- 23° South: Selected Writing & Frameworks request modal. -->
    <form name="work-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <input type="text" name="work" />
    </form>

    <!--
      KwaZuri pre-launch interest. Kept as its own form so this permission
      stays scoped to KwaZuri and is never merged with other enquiries.
    -->
    <form name="kwazuri-interest" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="hidden" name="tag" value="kwazuri_interest" />
    </form>

    <!-- Speaking & Executive Briefings enquiry. -->
    <form name="speaking-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <input type="text" name="role" />
      <input type="text" name="event-type" />
      <input type="text" name="audience" />
      <textarea name="decision"></textarea>
      <select name="timing">
        <option>Date confirmed</option>
        <option>Within 3 months</option>
        <option>3–6 months out</option>
        <option>More than 6 months away</option>
        <option>Exploring</option>
      </select>
      <textarea name="anything-else"></textarea>
    </form>

    <!-- General contact. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <!-- Partner Room (separate hostname; unchanged). -->
    <form
      name="partner-room-seat-request"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="url" name="company-website" />
      <select name="round">
        <option>Series A</option>
        <option>Other</option>
      </select>
      <select name="raise-timing">
        <option>Within 3 months</option>
        <option>Within 3–6 months</option>
        <option>More than 6 months away</option>
      </select>
      <textarea name="investor-targets"></textarea>
      <textarea name="room-concern"></textarea>
      <input type="url" name="deck-url" />
      <input type="hidden" name="utm-source" />
      <input type="hidden" name="utm-medium" />
      <input type="hidden" name="utm-campaign" />
      <input type="hidden" name="utm-content" />
      <input type="hidden" name="utm-term" />
      <input type="hidden" name="referral-url" />
      <input type="hidden" name="landing-page-url" />
      <input type="hidden" name="submitted-at" />
      <input
        type="hidden"
        name="subject"
        value="Partner Room seat request"
        data-remove-prefix
      />
    </form>
  </body>
</html>
