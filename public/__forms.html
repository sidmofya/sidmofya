<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection (do not link)</title>
  </head>
  <body>
    <!--
      This file exists so Netlify's build-time form-detection bot sees the
      client-rendered forms, which would otherwise not be present in the
      static HTML it scans.

      Every field on the live form MUST also appear here, with the same
      `name` attribute, or Netlify will drop it from submissions.
    -->
    <form name="work-with-me" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organization" />
      <input type="text" name="role" />
      <input type="radio" name="sprint" value="Speaking / Executive Briefing" />
      <input type="radio" name="sprint" value="Sovereign Stack Briefing" />
      <input type="radio" name="sprint" value="Market Legibility Sprint" />
      <input type="radio" name="sprint" value="Room-to-Results Sprint" />
      <input type="radio" name="sprint" value="ReInvention, referral only" />
      <input type="radio" name="sprint" value="Not sure" />
      <textarea name="message"></textarea>
      <textarea name="stakes"></textarea>
      <textarea name="involved"></textarea>
      <textarea name="valuable"></textarea>
      <select name="timing">
        <option>Urgent</option>
        <option>Next 30 days</option>
        <option>Exploring</option>
      </select>
      <select name="budget">
        <option>Under $2,500</option>
        <option>$2,500–$5,000</option>
        <option>$5,000–$10,000</option>
        <option>$10,000–$25,000</option>
        <option>Not sure</option>
      </select>
      <textarea name="anything-else"></textarea>
    </form>

    <form
      name="sovereign-geometry-waitlist"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
    </form>

    <form
      name="partner-room-seat-request"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="partner-room-seat-request" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="url" name="company-website" />
      <select name="round">
        <option>Series A</option>
        <option>Series A extension</option>
        <option>Other</option>
      </select>
      <select name="raise-timing">
        <option>Now / already preparing</option>
        <option>Within 3 months</option>
        <option>3 to 6 months</option>
        <option>6+ months</option>
        <option>Not sure yet</option>
      </select>
      <input type="text" name="raise-amount" />
      <textarea name="investor-targets"></textarea>
      <textarea name="room-concern"></textarea>
      <input type="url" name="deck-url" />
      <input type="hidden" name="utm-source" />
      <input type="hidden" name="utm-medium" />
      <input type="hidden" name="utm-campaign" />
      <input type="hidden" name="utm-content" />
      <input type="hidden" name="utm-term" />
      <input type="hidden" name="referral-url" />
      <input type="hidden" name="landing-page-url" />
      <input type="hidden" name="submitted-at" />
      <input
        type="hidden"
        name="subject"
        value="Partner Room request"
        data-remove-prefix
      />
    </form>
  </body>
</html>
